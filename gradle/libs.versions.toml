[versions]
agp                         = "8.13.0"
android-compileSdk          = "36"
android-minSdk              = "26"
android-targetSdk           = "36"
androidx-activityCompose            = "1.11.0"
androidx-appcompat                  = "1.7.1"
androidx-constraintlayout           = "2.2.1"
androidx-core-ktx                   = "1.17.0"
androidx-espresso-core              = "3.7.0"
androidx-lifecycle                  = "2.9.3"
androidx-test-junit                 = "1.3.0"
compose-multiplatform               = "1.8.2"
junit                               = "4.13.2"
kotlin                              = "2.2.20"
ktor                                = "3.3.0"
coroutines                          = "1.10.2"
kotlinx-serialization               = "1.9.0"
compose-navigation                  = "2.9.0-rc02"
components-resources                = "1.8.2"
napier                              = "2.7.1"
inspektor                           = "0.3.9"
datastore                           = "1.1.7"
okio                                = "3.16.0"

[libraries]
kotlin-test                         = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit                   = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit                               = { group = "junit", name = "junit", version.ref = "junit" }
androidx-core-ktx                   = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-test-junit                 = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-espresso-core              = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }
androidx-appcompat                  = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-constraintlayout           = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-activity-compose           = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-runtime-compose  = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
ktor-client-core                    = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp                  = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin                  = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio                     = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-auth                    = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-content-negotiation     = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
kotlinx-serialization-core          = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json          = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-serialization-kotlinx-json     = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging                 = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
#ktor-client-timeout                = { group = "io.ktor", name = "ktor-client-timeout", version.ref = "ktor" }
kotlinx-coroutines-core             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
navigation-compose                  = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "compose-navigation" }
compose-components-resources        = { module = "org.jetbrains.compose.components:components-resources", version.ref = "components-resources" }
napier                              = { module = "io.github.aakira:napier", version.ref = "napier" }
inspektor                           = { module = "com.gyanoba.inspektor:inspektor", version.ref = "inspektor" }
datastore-core                      = { module = "androidx.datastore:datastore", version.ref = "datastore" }
datastore-preferences               = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
okio                                = { module = "com.squareup.okio:okio", version.ref = "okio" }

[plugins]
androidApplication                  = { id = "com.android.application", version.ref = "agp" }
androidLibrary                      = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform                = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler                     = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform                 = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinx-serialization               = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }